<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width, initial-scale=1"><title>dsh · Market workspace</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div class="brand"><span class="brand-icon">d</span><strong>dsh</strong><span class="divider"></span><span>工作终端</span></div><nav><span class="tab active">行情终端</span><button id="tracking-open" class="tab">持续跟踪</button><button id="conversation" class="tab">Agent</button></nav><div id="monitor-mount" class="monitor-mount" title="本地采集服务"><span class="monitor-label">监控</span><span id="agent-dot" class="dot"></span><span id="state">连接中</span><button id="poll" title="立即采集" aria-label="立即采集">↻</button></div><span id="connection" class="connection">连接中</span></header>
<main class="terminal">
<aside class="watch-panel"><div class="panel-heading"><h2>市场</h2><span id="count" class="count">0</span></div>
<div class="market-picker"><input id="market-search" placeholder="搜索币种" aria-label="搜索币种"><select id="market-category" aria-label="市场"><option value="USDT-FUTURES">USDT 永续</option><option value="SPOT">现货 · USDT</option><option value="USDC-FUTURES">USDC 永续</option></select><div id="market-tabs"><button data-mode="turnover" class="active">成交额</button><button data-mode="heat" title="按 24h 涨跌幅绝对值排序，并非官方热度">热度</button><button data-mode="favorites">自选</button></div><span id="market-summary"></span></div><form id="add" hidden><input id="symbol"><select id="category"><option>USDT-FUTURES</option></select><button id="add-button"></button></form><div class="list-heading"><span>品种 / 24h 成交额</span><span>价格 / 涨跌</span></div><div id="watchlist" class="watchlist"></div><p id="empty" class="empty-watch">添加自选品种<br>开始持续观察市场</p><div class="watch-footer"><span class="dot"></span> BITGET · 公开市场数据</div></aside>
<section class="market-panel"><div class="instrument-heading"><div><div class="instrument-line"><h1 id="chart-symbol">选择交易品种</h1><span id="chart-market" class="market-tag">BITGET</span></div><p id="chart-caption" hidden></p></div><div class="quote"><strong id="headline-price">—</strong><span id="quote-status">等待选择</span></div></div>
<div class="chart-toolbar"><div id="intervals" class="intervals" aria-label="K 线周期"><button data-interval="1m" class="active">1分</button><button data-interval="5m">5分</button><button data-interval="15m">15分</button><button data-interval="1H">1时</button><button data-interval="4H">4时</button><button data-interval="1D">日线</button></div><button id="chart-reset">重置视图</button></div>
<div id="ohlc" class="ohlc">O —　 H —　 L —　 C —　 V —</div><div class="canvas-wrap"><canvas id="chart" aria-label="真实价格 K 线与成交量；滚轮缩放，Shift 加滚轮查看历史"></canvas></div><div class="chart-footer"><span id="chart-status">尚未加载 K 线</span></div></section>
<aside class="details-panel"><div class="panel-heading"><h2>行情详情</h2><span class="subtle">BITGET</span></div><div class="detail-quote"><h3 id="detail-symbol">未选择品种</h3><strong id="detail-price">—</strong><p id="detail-category">—</p></div><dl class="quote-facts"><div><dt>24h 成交量 · 基础币</dt><dd id="detail-volume">—</dd></div><div><dt>行情时间</dt><dd id="detail-exchange">—</dd></div><div><dt>本地采集时间</dt><dd id="detail-collected">—</dd></div><div><dt>行情状态</dt><dd id="detail-status">等待选择</dd></div></dl><button id="remove" class="remove" disabled>从自选列表移除</button>
</aside>
<section class="events-panel"><div class="panel-heading"><div class="event-tabs"><h2>采集记录</h2></div></div><div class="event-table"><div class="event-head"><span>时间</span><span>品种</span><span>市场</span><span>状态</span></div><div id="events"><p class="events-empty">尚无采集事件</p></div></div></section>
<section id="tracking-odds" class="tracking-odds" aria-label="追踪行情动态胜率" hidden><div class="tracking-odds-header"><div><span class="tracking-odds-kicker">动态胜率</span><span id="tracking-odds-symbol">—</span><span id="tracking-odds-phase" class="tracking-odds-phase">等待追踪</span></div><button id="tracking-odds-open" aria-label="打开持续追踪详情">↗</button></div><div class="tracking-odds-values"><div><span>BUY</span><strong id="tracking-buy">—</strong></div><div><span>HOLD</span><strong id="tracking-hold">—</strong></div><div><span>SELL</span><strong id="tracking-sell">—</strong></div></div><small id="tracking-odds-window">历史样本积累中</small></section><aside id="conversation-panel" class="conversation-panel" hidden><div class="panel-heading"><h2>Agent</h2><button id="conversation-close" aria-label="关闭 Agent 面板">×</button></div><div class="agent-context" id="agent-context"></div><details class="agent-settings" open><summary>DeepSeek 设置</summary><label>API Key<input id="agent-key" type="password" autocomplete="off" placeholder="输入 DeepSeek API Key"></label><button id="agent-save">保存密钥</button><label>模型<select id="agent-model"></select></label><button id="agent-new">新建会话</button><p id="agent-skill-list" class="skill-status"></p></details><p id="agent-status" role="status">连接 dsh…</p><div id="agent-messages" class="conversation-body"></div><div id="agent-interactions"></div><div class="composer"><textarea id="agent-draft" aria-label="对话草稿" placeholder="输入你的观察或问题" rows="4"></textarea><div class="agent-actions"><button id="agent-stop">停止</button><button id="agent-send" disabled>发送</button></div></div></aside></main><footer class="statusbar"><span id="message" role="status"></span><span><span class="dot"></span></span></footer><script src="chart.js"></script><script src="chat-view.js"></script><script src="market-tracking-view.js"></script><script src="renderer.js"></script></body></html>
