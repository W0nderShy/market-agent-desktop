<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>持续跟踪 · Trading Terminal</title><link rel="stylesheet" href="style.css"></head><body class="tracking-window"><section id="tracking-console" class="tracking-console" aria-label="持续跟踪"><div class="panel-heading"><h2>持续跟踪</h2></div><div class="tracking-controls"><p id="tracking-selected"></p><div class="tracking-controls-row"><input id="tracking-symbol" value="ZECUSDT" aria-label="跟踪标的" maxlength="40"><select id="tracking-category" aria-label="市场"><option value="USDT-FUTURES">USDT 永续</option><option value="SPOT">现货</option><option value="USDC-FUTURES">USDC 永续</option></select></div><div class="tracking-controls-row"><select id="tracking-interval" aria-label="研究周期"><option value="15m">15 分钟</option><option value="1H">1 小时</option><option value="4H">4 小时</option></select><button id="tracking-enable">开启跟踪</button><button id="tracking-zec">关注 ZEC</button></div><p class="subtle">持续观察变化 · 需要修订判断时启动研究</p><details class="wechat-mount"><summary>微信挂载 <span id="wechat-state">未连接</span></summary><p>仅使用腾讯官方 ClawBot。只在研究判断或三项比例明显变化时推送。长时间没有微信消息时，主动推送可能因会话失效而等待你重新发消息。</p><div class="wechat-actions"><button id="wechat-login">扫码连接</button><button id="wechat-toggle" disabled>开启通知</button><label>比例变化间隔 <select id="wechat-cadence"><option value="6">6 小时</option><option value="3">3 小时</option><option value="1">1 小时</option><option value="12">12 小时</option></select></label></div><img id="wechat-qr" alt="微信 ClawBot 连接二维码" hidden><div id="wechat-verify" hidden><input id="wechat-verify-code" inputmode="numeric" pattern="[0-9]*" placeholder="手机显示的验证码" aria-label="微信验证码"><button id="wechat-verify-submit">验证</button></div><small id="wechat-help"></small><div id="wechat-delivery"></div></details></div><p id="tracking-message" role="status"></p><div id="tracking-tasks"></div></section><script src="tracking.js"></script></body></html>
